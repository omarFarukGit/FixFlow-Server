            format: uuid
          example: 4d3811e4-aeaf-40ac-8963-82edfefe19fc

      responses:
        "200":
          description: Category deleted successfully

          content:
            application/json:
              schema:
                type: object

                properties:
                  success:
                    type: boolean
                    example: true

                  statusCode:
                    type: integer
                    example: 200

                  message:
                    type: string
                    example: Category deleted successfully

                  data:
                    type: object

        "401":
          description: Unauthorized

        "403":
          description: Only administrators can delete categories

        "404":
          description: Category not found

        "500":
          description: Internal server error


  # ============================================================
  # PAYMENT
  # ============================================================

  /payments/create-checkout-session:
    post:
      tags:
        - Payment

      summary: Create Stripe Checkout Session

      description: >
        Creates a Stripe Checkout Session for a completed service request.
        Only authenticated customers can create a payment.
        The service request must belong to the authenticated customer,
        have COMPLETED status, and have a final price.

      operationId: createCheckoutSession

      security:
        - bearerAuth: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              required:
                - serviceRequestId

              properties:
                serviceRequestId:
                  type: string
                  format: uuid
                  description: Unique ID of the completed service request
                  example: 4dee7d9d-4293-407a-8a00-cccb1d363b45

      responses:

        "201":
          description: Checkout session created successfully

          content:
            application/json:
              schema:
                type: object

                properties:
                  success:
                    type: boolean
                    example: true

                  statusCode:
                    type: integer
                    example: 201

                  message:
                    type: string
                    example: Checkout session created successfully

                  data:
                    type: object

                    properties:
                      paymentId:
                        type: string
                        format: uuid
                        example: 7b9c8f1a-2c4d-4e6f-8a1b-9d2e3f4a5b6c

                      checkoutUrl:
                        type: string
                        format: uri
                        description: Stripe Checkout URL
                        example: https://checkout.stripe.com/c/pay/cs_test_a1b2c3d4

                      amount:
                        type: number
                        format: double
                        description: Payment amount in BDT
                        example: 1500

                      currency:
                        type: string
                        example: BDT

        "400":
          description: >
            Payment cannot be created because the service request is not
            completed or the final price is unavailable.

          content:
            application/json:
              schema:
                type: object

                properties:
                  success:
                    type: boolean
                    example: false

                  statusCode:
                    type: integer
                    example: 400

                  message:
                    type: string

              examples:

                serviceNotCompleted:
                  summary: Service request is not completed

                  value:
                    success: false
                    statusCode: 400
                    message: Payment is only available for completed service requests

                finalPriceMissing:
                  summary: Final price is not available

                  value:
                    success: false
                    statusCode: 400
                    message: Final price is not available

        "401":
          description: Unauthorized

          content:
            application/json:
              schema:
                type: object

                properties:
                  success:
                    type: boolean
                    example: false

                  statusCode:
                    type: integer
                    example: 401

                  message:
                    type: string
                    example: Unauthorized

        "403":
          description: Only customers can create payments

          content:
            application/json:
              schema:
                type: object

                properties:
                  success:
                    type: boolean
                    example: false

                  statusCode:
                    type: integer
                    example: 403

                  message:
                    type: string
                    example: Forbidden

        "404":
          description: Service request not found

          content:
            application/json:
              schema:
                type: object

                properties:
                  success:
                    type: boolean
                    example: false

                  statusCode:
                    type: integer
                    example: 404

                  message:
                    type: string
                    example: Service request not found

        "409":
          description: Payment already completed or payment is in progress

          content:
            application/json:
              schema:
                type: object

                properties:
                  success:
                    type: boolean
                    example: false

                  statusCode:
                    type: integer
                    example: 409

                  message:
                    type: string

              examples:

                alreadyPaid:
                  summary: Payment already completed

                  value:
                    success: false
                    statusCode: 409
                    message: Payment has already been completed

                paymentPending:
                  summary: Payment already in progress

                  value:
                    success: false
                    statusCode: 409
                    message: Payment is already in progress

        "500":
          description: Internal server error


  # ============================================================
  # STRIPE WEBHOOK
  # ============================================================

  /payments/stripe/webhook:
    post:
      tags:
        - Payment

      summary: Stripe Webhook

      description: >
        Receives webhook events from Stripe and updates the payment status.
        Stripe sends events to this endpoint after payment activities.
        The Stripe-Signature header is used to verify the authenticity
        of the webhook request.

        This endpoint must receive the request body as raw JSON because
        Stripe webhook signature verification requires the original
        request payload.

      operationId: handleStripeWebhook

      parameters:

        - name: stripe-signature
          in: header
          required: true

          description: >
            Stripe webhook signature used to verify the webhook request.

          schema:
            type: string

          example: t=1750000000,v1=abcdef1234567890

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

            example:
              id: evt_1Example123456
              object: event
              type: checkout.session.completed
              data:
                object:
                  id: cs_test_example123
                  object: checkout.session
                  metadata:
                    serviceRequestId: 4dee7d9d-4293-407a-8a00-cccb1d363b45
                    customerId: 7b9c8f1a-2c4d-4e6f-8a1b-9d2e3f4a5b6c
                  payment_intent: pi_example123456

      responses:

        "200":
          description: Webhook received successfully

          content:
            application/json:
              schema:
                type: object

                properties:
                  received:
                    type: boolean
                    example: true

              example:
                received: true

        "400":
          description: Invalid Stripe webhook signature or payload

          content:
            application/json:
              schema:
                type: object

                properties:
                  success:
                    type: boolean
                    example: false

                  statusCode:
                    type: integer
                    example: 400

                  message:
                    type: string

              examples:

                missingSignature:
                  summary: Stripe signature is missing

                  value:
                    success: false
                    message: Stripe signature is missing

                invalidSignature:
                  summary: Invalid Stripe webhook signature

                  value:
                    success: false
                    statusCode: 400
                    message: Invalid Stripe webhook signature

                missingServiceRequest:
                  summary: Service request ID missing

                  value:
                    success: false
                    statusCode: 400
                    message: Service request ID missing from Stripe session

        "404":
          description: Payment not found

          content:
            application/json:
              schema:
                type: object

                properties:
                  success:
                    type: boolean
                    example: false

                  statusCode:
                    type: integer
                    example: 404

                  message:
                    type: string
                    example: Payment not found

        "500":
          description: Internal server error

  /payments/my-payments:
    get:
      tags:
        - Payment
      summary: Get my payments
      description: Get authenticated customer's payment history
      security:
        - bearerAuth: []
