openapi: 3.0.3

info:
  title: FixFlow API
  description: Field Service Management System API
  version: 1.0.0

servers:
  - url: http://localhost:5000/api/v1
    description: Local development server

tags:
  - name: Auth
    description: Authentication APIs

paths:
  /auth/register:
    post:
      tags:
        - Auth

      summary: Register a new user

      description: >
        Creates a new Customer or Technician account and sends an email
        verification OTP to the user's email address.

      operationId: registerUser

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              required:
                - name
                - email
                - password
                - role

              properties:
                name:
                  type: string
                  example: Muhammad Omar Faruk

                email:
                  type: string
                  format: email
                  example: omar@example.com

                password:
                  type: string
                  format: password
                  example: Password123!

                role:
                  type: string
                  enum:
                    - CUSTOMER
                    - TECHNICIAN
                  example: CUSTOMER

      responses:
        "201":
          description: User registered successfully and verification OTP sent

          content:
            application/json:
              schema:
                type: object

                properties:
                  success:
                    type: boolean
                    example: true

                  statusCode:
                    type: integer
                    example: 201

                  message:
                    type: string
                    example: Verification OTP sent to your email

                  data:
                    type: object
                    example: {}

        "400":
          description: Validation error

        "409":
          description: Email already exists

        "500":
          description: Internal server error


  /auth/verify-email:
    post:
      tags:
        - Auth

      summary: Verify user email

      description: >
        Verifies the user's email address using the OTP sent during registration.

      operationId: verifyEmail

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              required:
                - email
                - otp

              properties:
                email:
                  type: string
                  format: email
                  example: omar@example.com

                otp:
                  type: string
                  example: "123456"

      responses:
        "200":
          description: Email verified successfully

          content:
            application/json:
              schema:
                type: object

                properties:
                  success:
                    type: boolean
                    example: true

                  statusCode:
                    type: integer
                    example: 200

                  message:
                    type: string
                    example: Email verified successfully

                  data:
                    type: object
                    example: {}

        "400":
          description: Invalid or expired OTP

        "404":
          description: User not found

        "500":
          description: Internal server error