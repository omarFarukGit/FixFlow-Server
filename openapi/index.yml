  # ============================================================
  # REVIEW
  # ============================================================

  # Review endpoints will be added here.

  /reviews:
    post:
      tags:
        - Customer
      summary: Create a review
      description: Customer can submit a review for a completed and paid service request.
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - serviceRequestId
                - rating
              properties:
                serviceRequestId:
                  type: string
                  format: uuid
                  description: ID of the completed service request
                  example: 123e4567-e89b-12d3-a456-426614174000

                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  description: Rating given to the technician
                  example: 5

                comment:
                  type: string
                  maxLength: 1000
                  nullable: true
                  description: Optional review comment
                  example: Excellent service. Very professional technician.

      responses:
        "201":
          description: Review created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

                  message:
                    type: string
                    example: Review created successfully

                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: 987e6543-e21b-12d3-a456-426614174111

                      rating:
                        type: integer
                        example: 5

                      comment:
                        type: string
                        nullable: true
                        example: Excellent service. Very professional technician.

                      serviceRequestId:
                        type: string
                        format: uuid
                        example: 123e4567-e89b-12d3-a456-426614174000

                      reviewerId:
                        type: string
                        format: uuid
                        example: 456e7890-e12b-34d5-a678-426614174222

                      technicianId:
                        type: string
                        format: uuid
                        example: 789e0123-e45b-67c8-a901-426614174333

                      createdAt:
                        type: string
                        format: date-time
                        example: "2026-09-07T08:00:00.000Z"

                      updatedAt:
                        type: string
                        format: date-time
                        example: "2026-09-07T08:00:00.000Z"

        "400":
          description: Invalid request, service not completed, or payment not completed

        "401":
          description: Unauthorized

        "403":
          description: Forbidden - Customer access required

        "404":
          description: Service request or technician not found

        "409":
          description: Review has already been submitted

        "500":
          description: Internal server error

