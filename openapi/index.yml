openapi: 3.0.3

info:
  title: FixFlow API
  description: Field Service Management System API
  version: 1.0.0

servers:
  - url: http://localhost:5000/api/v1
    description: Local development server

tags:
  - name: Auth
    description: Authentication APIs
  - name: User
    description: User management APIs
paths:
  /auth/register:
    post:
      tags:
        - Auth

      summary: Register a new user

      description: >
        Creates a new Customer or Technician account and sends an email
        verification OTP to the user's email address.

      operationId: registerUser

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              required:
                - name
                - email
                - password
                - role

              properties:
                name:
                  type: string
                  example: Muhammad Omar Faruk

                email:
                  type: string
                  format: email
                  example: omar@example.com

                password:
                  type: string
                  format: password
                  example: Password123!

                role:
                  type: string
                  enum:
                    - CUSTOMER
                    - TECHNICIAN
                  example: CUSTOMER

      responses:
        "201":
          description: User registered successfully and verification OTP sent

          content:
            application/json:
              schema:
                type: object

                properties:
                  success:
                    type: boolean
                    example: true

                  statusCode:
                    type: integer
                    example: 201

                  message:
                    type: string
                    example: Verification OTP sent to your email

                  data:
                    type: object
                    example: {}

        "400":
          description: Validation error

        "409":
          description: Email already exists

        "500":
          description: Internal server error

  /auth/verify-email:
    post:
      tags:
        - Auth

      summary: Verify user email

      description: >
        Verifies the user's email address using the OTP sent during registration.

      operationId: verifyEmail

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              required:
                - email
                - otp

              properties:
                email:
                  type: string
                  format: email
                  example: omar@example.com

                otp:
                  type: string
                  example: "123456"

      responses:
        "200":
          description: Email verified successfully

          content:
            application/json:
              schema:
                type: object

                properties:
                  success:
                    type: boolean
                    example: true

                  statusCode:
                    type: integer
                    example: 200

                  message:
                    type: string
                    example: Email verified successfully

                  data:
                    type: object
                    example: {}

        "400":
          description: Invalid or expired OTP

        "404":
          description: User not found

        "500":
          description: Internal server error

  /auth/login:
    post:
      tags:
        - Auth

      summary: Login user

      description: >
        Authenticates a registered user using email and password and returns
        an access token and refresh token.

      operationId: loginUser

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              required:
                - email
                - password

              properties:
                email:
                  type: string
                  format: email
                  example: muhammadabuhafiz@gmail.com

                password:
                  type: string
                  format: password
                  example: Password123!

      responses:
        "200":
          description: Login successful

          content:
            application/json:
              schema:
                type: object

                properties:
                  success:
                    type: boolean
                    example: true

                  statusCode:
                    type: integer
                    example: 200

                  message:
                    type: string
                    example: Login successful

                  data:
                    type: object

                    properties:
                      accessToken:
                        type: string
                        description: JWT access token
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

                      refreshToken:
                        type: string
                        description: JWT refresh token
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

        "400":
          description: Invalid email or password

        "401":
          description: Unauthorized

        "404":
          description: User not found

        "500":
          description: Internal server error   
  /auth/refresh-token:
    post:
      tags:
        - Auth

      summary: Refresh access token

      description: >
        Generates a new access token and refresh token using a valid refresh
        token provided through the Authorization Bearer header.

      operationId: refreshAccessToken

      security:
        - refreshTokenAuth: []

      responses:
        "200":
          description: Refresh token successful

          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

                  statusCode:
                    type: integer
                    example: 200

                  message:
                    type: string
                    example: Refresh token successful

                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

                      refreshToken:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

        "401":
          description: Invalid or expired refresh token

        "404":
          description: User not found

        "500":
          description: Internal server error

  /auth/forgot-password:
    post:
      tags:
        - Auth

      summary: Forgot password

      description: >
        Sends a password reset OTP to the user's registered email address.

      operationId: forgotPassword

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              required:
                - email

              properties:
                email:
                  type: string
                  format: email
                  example: muhammadabuhafz@gmail.com

      responses:
        "200":
          description: Password reset OTP sent successfully

          content:
            application/json:
              schema:
                type: object

                properties:
                  success:
                    type: boolean
                    example: true

                  statusCode:
                    type: integer
                    example: 200

                  message:
                    type: string
                    example: Password reset otp sent to your email

        "400":
          description: Invalid email address

        "404":
          description: User not found

        "500":
          description: Internal server error

  /auth/reset-password:
    post:
      tags:
        - Auth
      summary: Reset password
      description: >
        Resets the user's password using a valid password reset OTP.
      operationId: resetPassword

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
                - newPassword
              properties:
                email:
                  type: string
                  format: email
                  example: muhammadabuhafz@gmail.com

                otp:
                  type: string
                  description: Password reset OTP
                  example: "126066"

                newPassword:
                  type: string
                  format: password
                  description: New password
                  example: "588888Aaj*"

      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

                  statusCode:
                    type: integer
                    example: 200

                  message:
                    type: string
                    example: Password reset successful

        "400":
          description: Invalid request or validation error

        "401":
          description: Invalid or expired OTP

        "404":
          description: User not found

        "500":
          description: Internal server error

  /auth/google:
    get:
      tags:
        - Auth

      summary: Login with Google

      description: |
        Initiates Google OAuth login for customers.

        This endpoint redirects the user to Google's OAuth consent screen.

        Important: This endpoint uses a browser redirect flow and cannot be
        reliably tested using Swagger UI's "Try it out" feature.

        To test Google login, open this URL directly in a browser:

        http://localhost:5000/api/v1/auth/google

        After successful authentication, Google automatically redirects the
        user to the callback endpoint.

      operationId: googleLogin

      responses:
        "302":
          description: Redirect to Google OAuth login page

        "500":
          description: Internal server error

  /auth/google/callback:
    get:
      tags:
        - Auth

      summary: Google OAuth callback

      description: |
        Handles the callback from Google after successful authentication.

        Google automatically calls this endpoint with an authorization code.

        Important: Do not manually test this endpoint with a custom code.
        Start the OAuth flow from /auth/google instead.

      operationId: googleCallback

      parameters:
        - name: code
          in: query
          required: false
          description: Authorization code automatically provided by Google
          schema:
            type: string

      responses:
        "200":
          description: Google login successful

          content:
            application/json:
              schema:
                type: object

                properties:
                  success:
                    type: boolean
                    example: true

                  statusCode:
                    type: integer
                    example: 200

                  message:
                    type: string
                    example: Google login successful

                  data:
                    type: object

                    properties:
                      id:
                        type: string
                        format: uuid
                        example: "4d3811e4-aeaf-40ac-8963-82edfefe19fc"

                      name:
                        type: string
                        example: Muhammad Omar Faruk

                      email:
                        type: string
                        format: email
                        example: omar@example.com

                      googleId:
                        type: string
                        example: "101458028521893356774"

                      authProvider:
                        type: string
                        enum:
                          - GOOGLE
                        example: GOOGLE

                      emailVerified:
                        type: boolean
                        example: true

                      role:
                        type: string
                        enum:
                          - CUSTOMER
                        example: CUSTOMER

                      imageUrl:
                        type: string
                        format: uri

        "400":
          description: Google authorization code is required

        "401":
          description: Google authentication failed

        "403":
          description: Google login is only available for customers

        "500":
          description: Internal server error
  
  /users/me:
    get:
      tags:
        - User

      summary: Get current user profile

      description: >
        Returns the profile information of the currently authenticated user.
        If the user is a technician, the technician profile is also included.

      operationId: getCurrentUser

      security:
        - bearerAuth: []

      responses:
        "200":
          description: Current user retrieved successfully

          content:
            application/json:
              schema:
                type: object

                properties:
                  success:
                    type: boolean
                    example: true

                  statusCode:
                    type: integer
                    example: 200

                  message:
                    type: string
                    example: User retrieved successfully

                  data:
                    type: object

                    properties:
                      id:
                        type: string
                        format: uuid

                      name:
                        type: string

                      email:
                        type: string
                        format: email

                      role:
                        type: string
                        enum:
                          - CUSTOMER
                          - TECHNICIAN
                          - ADMIN

                      technicianProfile:
                        type: object
                        nullable: true

        "401":
          description: Unauthorized

        "404":
          description: User not found

        "500":
          description: Internal server error
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

    refreshTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
                     