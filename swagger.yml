                            type: string
                            example: AC Repair
                          description:
                            type: string
                            nullable: true
                            example: Air conditioner repair, maintenance, and installation services.
                          imageUrl:
                            type: string
                            example: https://res.cloudinary.com/fixflow/image/upload/ac-repair.jpg
        '400':
          description: |
            Service request cannot be cancelled because its status is not PENDING
        '401':
          description: Unauthorized - authentication required
        '403':
          description: Forbidden - only customers can cancel service requests
        '404':
          description: Service request not found
        '500':
          description: Internal server error
