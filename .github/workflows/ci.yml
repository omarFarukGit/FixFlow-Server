name: FixFlow CI

on:
  push:
    branches:
      - development
      - main

  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Quality, Build and Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      # - name: Validate OpenAPI
      #   run: npx redocly lint openapi/index.yml

      - name: Generate Swagger documentation
        run: npm run swagger:docs

      - name: Format check
        run: npm run format:check

      - name: Lint check
        run: npm run lint:check

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Security audit
        run: npm run audit